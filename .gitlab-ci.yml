stages:
  - test_and_build
  - deploy

build-project:
  stage: test_and_build
  image: node:24
  cache:
    key: "node-cache"
    paths:
      - .npm/
  script:
    - npm ci --prefer-offline --no-audit --no-fund --cache .npm
    # test
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm test
    # build
    - npm run build
    # compress build
    - tar -czf build.tar.gz dist/ db/ package.json package-lock.json
  artifacts:
    paths:
      - build.tar.gz
    expire_in: 1 day

.ssh:
  image: alpine:3.22
  variables:
    SSH_OPTS: -o IdentitiesOnly=yes -o BatchMode=yes
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - chmod 600 "$SSH_PRIVATE_KEY_PROD"
    - ssh-keygen -y -f "$SSH_PRIVATE_KEY_PROD" > /dev/null
    - ssh-keyscan -p "$SSH_PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

check-ssh:
  extends: .ssh
  stage: deploy
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH != "master"
      when: manual
      allow_failure: true
  script:
    - ssh -i "$SSH_PRIVATE_KEY_PROD" $SSH_OPTS -p "$SSH_PORT" "$PROD_USER@$PROD_HOST" 'echo connected; which node npm pm2; pm2 list'

deploy-prod:
  extends: .ssh
  stage: deploy
  only:
    - master
  script:
    - scp -i "$SSH_PRIVATE_KEY_PROD" $SSH_OPTS -P "$SSH_PORT" build.tar.gz "$PROD_USER@$PROD_HOST:$APP_DIR/build.tar.gz"
    - |
      ssh -i "$SSH_PRIVATE_KEY_PROD" $SSH_OPTS -p "$SSH_PORT" "$PROD_USER@$PROD_HOST" bash -s -- "$APP_DIR" <<'REMOTE'
      set -euo pipefail
      cd "$1"
      tar -xzf build.tar.gz
      rm build.tar.gz
      npm ci --omit=dev --prefer-offline --no-audit --no-fund
      npm run db:up
      pm2 restart etu-forms-backend etu-forms-worker
      REMOTE
