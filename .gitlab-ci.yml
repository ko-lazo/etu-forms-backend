stages:
  - test_and_build
  - deploy

build-project:
  stage: test_and_build
  image: node:24
  cache:
    key: "node-cache"
    paths:
      - .npm/
  script:
    - npm ci --prefer-offline --no-audit --no-fund --cache .npm
    # test
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm test
    # build
    - npm run build
    # compress build
    - tar -czf build.tar.gz dist/ package.json package-lock.json
  artifacts:
    paths:
      - build.tar.gz
    expire_in: 1 day

deploy-prod:
  stage: deploy
  image: appleboy/drone-ssh:1.7.0
  only:
    - master
  variables:
    SSH_HOST: $PROD_HOST
    SSH_PORT: $SSH_PORT
    SSH_USER: $PROD_USER
    SSH_KEY: $SSH_PRIVATE_KEY_PROD
  script:
    - export SCP_SRC="build.tar.gz"
    - cd $APP_DIR
    - tar -xzf build.tar.gz
    - rm build.tar.gz
    - npm ci --omit=dev --prefer-offline --no-audit --no-fund
    - npx dbmate up
