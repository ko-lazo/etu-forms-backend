stages:
  - test_and_build
  - deploy

build-project:
  stage: test_and_build
  image: node:24
  cache:
    key: "node-cache"
    paths:
      - .npm/
  script:
    - npm ci --prefer-offline --no-audit --no-fund --cache .npm
    # test
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm test
    # build
    - npm run build
    # compress build
    - tar -czf build.tar.gz dist/ db/ package.json package-lock.json
  artifacts:
    paths:
      - build.tar.gz
    expire_in: 1 day

deploy-prod:
  stage: deploy
  image: alpine:3.22
  only:
    - master
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY_PROD" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -p "$SSH_PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - scp -i ~/.ssh/id_deploy -P "$SSH_PORT" build.tar.gz "$PROD_USER@$PROD_HOST:$APP_DIR/build.tar.gz"
    - |
      ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$PROD_USER@$PROD_HOST" bash -s -- "$APP_DIR" <<'REMOTE'
      set -euo pipefail
      cd "$1"
      tar -xzf build.tar.gz
      rm build.tar.gz
      npm ci --omit=dev --prefer-offline --no-audit --no-fund
      npm run db:up
      pm2 restart etu-forms-backend etu-forms-worker
      REMOTE
